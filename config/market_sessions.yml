# 시장별 세션 창 (spec §4.2 · §12.3 · C2-3)
#
# 🔴 **개장 시각을 코드에 박지 않는다** (절대 규칙 #7). 이 파일이 유일한 출처다.
#
# ⛔ **오프셋(`+09:00`)을 적지 않고 tz 이름을 적는다.** 미국은 서머타임 때문에 한 해의
#    절반이 UTC−4, 나머지가 UTC−5 다. 오프셋을 박으면 한 해의 절반이 한 시간 밀린다.
#    실측으로 확인된 사실이다 — AAPL 정규장 UTC 창이 13~20 과 14~21 사이를 오간다
#    (`docs/rules/stock_session_notes.md`).
#
# ⚠️ 시각은 **현지시각**이며 `[start, end)` 반열림 구간이다. `end` 자신은 그 세션에
#    속하지 않는다 — 15:30 봉은 정규장이 아니라 그다음 세션이다.

version: "1.0"

markets:
  # ── 한국거래소 ──────────────────────────────────────────────
  #
  # 🔴 적재된 1d 봉은 **시간외를 포함**한다 (실측: 1d.open 이 08:00 장전 봉 시가와
  #    199/199 일치, 정규장 시가와는 7/199). 그래서 분석은 1d 를 그대로 쓰지 않고
  #    `regular_only()` 로 거른 15m 에서 다시 만든다.
  KRX:
    timezone: Asia/Seoul
    trading_days: [mon, tue, wed, thu, fri]
    sessions:
      # 장전 동시호가. 체결은 09:00 에 한 번 일어난다.
      pre_open: { start: "08:30", end: "09:00" }
      regular:  { start: "09:00", end: "15:30" }
      # 장후 시간외종가(15:40~16:00) + 시간외 단일가(16:00~18:00) 를 하나로 본다.
      # 둘을 나눌 이유가 지금은 없다 — 어느 쪽이든 정규장이 아니다.
      post:     { start: "15:40", end: "18:00" }

  # ── 미국 ────────────────────────────────────────────────────
  #
  # ⚠️ 적재된 봉은 **24시간 전부에 있다** (AAPL 1h 이 UTC 0~23 시 전부에 존재).
  #    정규장 밖 거래량은 정규장의 1/100 수준이라 구분은 가능하지만, **데이터에
  #    표시가 없으므로** 이 표로 판정해야 한다.
  NASDAQ: &us_equity
    timezone: America/New_York
    trading_days: [mon, tue, wed, thu, fri]
    sessions:
      pre_open: { start: "04:00", end: "09:30" }
      regular:  { start: "09:30", end: "16:00" }
      post:     { start: "16:00", end: "20:00" }
    # 🔴 조기마감일의 정규장 종료 시각 (추수감사절 다음 날 등).
    #    DST 처리만으로는 부족하다는 것이 C2-4 의 요지다.
    early_close:
      regular_end: "13:00"
      post_end: "17:00"

  NYSE: *us_equity

  # ── 코인 ────────────────────────────────────────────────────
  #
  # 24시간 장이라 "현지"가 없다. 임의의 거래소 소재지를 고르면 그것이 근거 없는
  # 기준이 된다 — UTC 로 둔다.
  UPBIT:
    timezone: UTC
    always_open: true

  # Gate.io 무기한 선물 — 24시간, 휴장 없음.
  #
  # ⚠️ **펀딩 정산은 8시간마다다** (00:00 · 08:00 · 16:00 UTC). 장이 닫히는 것은
  #    아니지만 그 시각에 보유 중이면 비용이 붙는다 — "쉬는 시간이 없다"가 "비용
  #    사건이 없다"는 뜻은 아니다. 이 파일은 개장 여부만 다루므로 여기에는 안 적고
  #    `config/costs.yml` GATE 블록에 남겼다.
  GATE:
    timezone: UTC
    always_open: true

  # 바이낸스 USDT-M 무기한 (T62) — Gate 와 같은 24시간 · 펀딩 8h 정산은 costs.yml 소관.
  BINANCE:
    timezone: UTC
    always_open: true

# ── 휴장일 ───────────────────────────────────────────────────
#
# 🔴 **비어 있다는 것이 곧 "모른다"다.** 여기 없는 날을 자동으로 영업일로 보지 않는다.
#    크리스마스에 "정규장"이라고 답하는 것이 이 파일이 막아야 할 실패다.
#
# ⚠️ 목록이 없는 시장·구간은 `tradability()` 가 **"판정 불가"를 반환**한다.
#    적재된 일봉에서 실제 거래일을 읽어 보강할 수 있고(`trading_days_from_candles`),
#    그것은 적재 구간 안에서만 유효하다 — **미래 휴장일은 알 수 없다.**
#
# 데이터 소스는 X-4 (미착수). 미국 주식을 실제로 거래하기 전에 필요하다.
# ✅ 2026 을 채웠다 (T238 · 2026-09-09). 출처는 아래 각 시장 주석. **연 단위로 사람이 갱신**한다 — 12월에 다음 해를 넣고
#    `holiday_coverage` 를 늘린다. 갱신을 잊으면 `tradability()` 가 그 밖의 날짜에 UNKNOWN 을 내어 라이브가 멈춘다(조용히 틀리지 않는다).
holidays:
  # NYSE Group 공식 일정 (ICE 보도자료 · NYSE Group Announces 2025, 2026 and 2027 Holiday and Early Closings Calendar):
  # 신정 · MLK · 워싱턴 탄생일 · 성금요일 · 현충일 · 준틴스 · 독립기념일(7/4 토 → 7/3 대체) · 노동절 · 추수감사절 · 성탄절
  NASDAQ: &us_holidays_2026

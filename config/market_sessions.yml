  NYSE: *us_holidays_2026
  # 한국거래소 2026 (17일 · 공휴일 + 근로자의 날 + 연말 휴장 · 대체공휴일 포함 · 6/3 지방선거). 출처: jangjeon.kr 2026 증시 휴장일 —
  # ⚠️ KRX 공식 공지(krx.co.kr)와 연초에 대조한다. 임시공휴일이 새로 지정되면 여기 추가.
  KRX:
    - 2026-01-01
    - 2026-02-16
    - 2026-02-17
    - 2026-02-18
    - 2026-03-02
    - 2026-05-01
    - 2026-05-05
    - 2026-05-25
    - 2026-06-03
    - 2026-07-17
    - 2026-08-17
    - 2026-09-24
    - 2026-09-25
    - 2026-10-05
    - 2026-10-09
    - 2026-12-25
    - 2026-12-31
# 조기마감(정규장 13:00 ET 종료 · `early_close.regular_end`): 추수감사절 다음 날 · 크리스마스 이브
early_close_days:
  NASDAQ: &us_early_2026
    - 2026-11-27
    - 2026-12-24
  NYSE: *us_early_2026
# 🔴 휴장일 목록이 **유효한 구간** — 이 밖의 날짜는 UNKNOWN 이다 (목록에 없는 미래 날짜를 자동으로 영업일로 보지 않는다).
holiday_coverage:
  NASDAQ: { from: 2026-01-01, to: 2026-12-31 }
  NYSE:   { from: 2026-01-01, to: 2026-12-31 }
  KRX:    { from: 2026-01-01, to: 2026-12-31 }

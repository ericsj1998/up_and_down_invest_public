# 수집 대상 시간축 — **측정이 실제로 쓰는 것**이다.
#
# 🔴 2026-08-09 수정: `[5m, 1h, 1d]` → `[15m, 1h, 1d]`.
#
#    측정은 **15m 으로 진입**하는데 이 목록에 15m 이 없었다. 즉 `--full` 이
#    **필요한 것을 안 받고 안 쓰는 것을 받고 있었다** — BTC·ETH 의 15m 은 별도로
#    손으로 채운 것이고, 코인 4종을 추가할 때 전용 스크립트가 필요했던 이유가 이것이다.
#
#    5m 을 뺀 근거: **5m 단독 진입은 산술 반증으로 폐기됐다** (§1-0i). 익절 거리
#    2.47xATR 에 비용을 넣으면 필요 승률 100.7~100.9% 다. 이미 적재된 5m 은 지우지
#    않는다 — 커버리지는 늘어날 뿐 줄지 않는다는 원칙(위 앵커 주석)과 같은 이유다.
#
#    4h 는 받지 않는다 — 15m 에서 합성한다 (`measure_run._candles_for`). 합성이
#    원본과 같은 결과를 낸다는 것은 1h 을 양쪽으로 돌려 확인했다 (§1-0i).
#
# ⚠️ 주식은 **1d 를 먼저** 받아야 한다 — 일봉이 곧 거래일 달력이고, 그것이 없으면
#    결측 판정이 장 마감을 전부 구멍으로 센다. 목록 순서가 그 순서다.
timeframes:
  - 1d
  - 1h
  - 15m


# 캔들 백필 범위 (P0-8-7 · plan D-15)
#
# ⭐ **시작일은 고정이다. 실행 시점마다 밀리지 않는다.**
#
#    "오늘 기준 뒤로 1년" 방식이면 커버리지 하한이 매일 움직인다. 그러면 같은 백테스트를
#    다시 돌렸을 때 데이터 시작점이 달라져 결과가 바뀌고, 원칙 P1(동일 입력 → 동일 출력)이
#    데이터 쪽에서 깨진다. 종료일만 현재로 전진한다 — 커버리지는 **늘어날 뿐 줄지 않는다.**

# 수집 시작 기준일 (UTC, 이 시각의 봉부터 포함).
#
# ⭐ **2026-08-07 변경: 2025-08-01 → 2024-07-01 (1년 → 약 2년)**
#
#    ⚠️ 2026-08-09 정정: 예전 주석은 이것을 "3년"이라고 적었으나 **틀렸다.**
#    2024-07-01 부터 2026-08 까지는 **약 25개월(2.1년)** 이다. 걸치는 달력 연도
#    (2024·2025·2026)를 센 것으로 보인다. out-of-sample 분할(§1-0t T10)이 이 길이에
#    직접 걸리므로 숫자를 정확히 적는다.
#
#    방향 전환에 따른 것이다. 판정 질문이 "이 룰이 코인 2종목 1년에서 되는가"에서
#    "차트 분석 근거들이 **자산군을 가리지 않고** 통하는가"로 바뀌었고, 1년 한 구간은
#    시장 국면 하나만 담아 그 질문에 답할 수 없다 (원칙 P6 · §12.9 out-of-sample).
#
#    측정 목표 구간은 **2024-07-01 ~ 2026-07-31** 이다. 앵커를 그 시작에 맞춘다.
#
# 2024-07-01 을 택한 이유:
#   - 목표 구간(3년치 판정)의 시작이며 UTC 월 경계라 candles 월 파티션과 맞는다
#   - 일봉 경계(00:00 UTC)와도 일치한다
#
# 변경 규칙:
#   - **더 과거로 내리는 것은 허용**한다 (옛 데이터가 추가될 뿐, 기존 봉은 그대로다)
#   - **앞으로 올리는 것은 금지**한다 — 이미 적재된 구간을 커버리지에서 잘라내면
#     그 구간을 쓰던 백테스트가 재현되지 않는다
#   - 바꿀 때는 docs/rules/candle_integrity_rules.md 조정 이력에 근거를 남긴다
#
# ⚠️ 이 변경은 **허용 방향(과거로)** 이므로 기존 적재분은 그대로 살아 있다.
history_anchor: "2024-07-01T00:00:00Z"

# 검증 유니버스 — **어떤 종목을 다루는가의 단일 출처**다 (universe.py 주석).
#
# ⭐ 2026-08-07: 방향 전환(P1 §1-0j)으로 코인 2종 → **7종목 3시장**.
#    "차트 분석 근거가 자산군을 가리지 않고 통하는가"가 판정 질문이 됐고(원칙 P6),
#    코인만으로는 그 질문에 답할 수 없다.
#
# 심볼 → 시장·종목명 매핑은 `marketdata/ingest/universe.py` 가 갖는다.
# 여기에 심볼을 추가하려면 그쪽 표(UPBIT_KRW_NAMES / STOCK_SPECS)에도 있어야 한다 —
# 없으면 `UnknownSymbolError` 로 **시드 시점에** 걸린다 (조용히 넘어가지 않는다).
#
# ⚠️ 주식은 코인과 수집 특성이 다르다:
#   - 5m·15m·1h 는 브로커가 안 준다 → TossAdapter 가 분봉에서 합성한다 (1봉당 5~60배 호출)
#   - 장이 닫힌 시간에는 봉이 없다 → 결측 판정에 거래일 달력이 필요하다 (P1 §1-0j)
#   - **1d 를 먼저 백필해야 한다** — 일봉이 곧 거래일 달력이다
# ⭐ 2026-08-09: 코인 2종 → **6종**. out-of-sample 분리(T10)의 선행 조건이다.
#
#    v2 회차에서 코인 15m 이 **셋업당 43~64건**이었다. 뒤 구간을 OOS 로 떼면 셋업당
#    15~20건이 되어 §12.9(30건) 미달 — 시간만 쓰고 "판정하지 않고 기존 유지"가 된다.
#    종목 추가는 **게이트 완화가 아니라 데이터 추가**이므로 §12.9 상 정당한 유일한
#    표본 확보 경로다 (⛔ 게이트를 낮춰 표본을 늘리는 것은 조작이다).
#
#    ⚠️ 코인끼리는 상관이 높아 "완전히 독립인 표본"은 아니다. 그 한계를 알고 쓰되,
#    BTC·ETH 둘만 쓰는 것보다는 분명히 낫다.
universe:

# 매 실행마다 **되돌아가서 다시 받는** 봉 수.
#
# 최신 봉 하나만 받으면 일시 장애로 빠진 구멍이 영구히 남는다. 최근 구간을 겹쳐 받으면
# 그 구멍이 다음 실행에서 자동으로 메워진다 (upsert 라 중복이 무해하다).
#
# 60봉이면 5m 기준 5시간, 1h 기준 2.5일이다. 어댑터 1회 응답 상한(200봉) 안이라
# 페이지 반복 없이 한 번에 받는다.
gap_lookback_bars: 60

# 한 번의 주기 수집이 따라잡을 최대 봉 수.
#
# engine 이 오래 멈춰 있었다면 그 구멍은 **주기 수집의 일이 아니라 백필의 일**이다.
# 상한 없이 두면 기동 직후 잡 하나가 수만 봉을 받으며 rate limit 을 독점하고, 그 사이
# 다른 시간축 수집이 밀린다. 상한을 넘는 구멍은 **경고를 남기고** 백필 CLI 로 넘긴다 —
# 조용히 일부만 받고 성공으로 보고하지 않는다 (spec §7).
max_catchup_bars: 400

# AI 차트 분석 · 채팅 — LLM 후보 풀 (Phase 5 §5-4 · T248 · T249)
#
# 사용자가 고른 10종(docs/providers/nvidia_llm_api_docs.md)에서 출발했으나 카탈로그가 두 번 바뀌었다:
#   2026-08-10 실검증 — 10종 중 3종만 살아 있어 6종을 후속 판으로 교체.
#   2026-09-10 실검증 — 그 10종 중 **7종이 410 폐기**(glm-5.2 · inkling · minimax-m3 · gpt-oss-120b ·
#   llama-3.3-70b · nemotron-super-49b · nemotron-nano-9b). deepseek-v4-flash 는 살아 있으나 짧은 핑에도
#   180초 타임아웃(3회 연속)이라 뺐다. 아래 6종은 전부 **도구 호출 포함 채팅 실호출**로 확인했다
#   (`scripts/dev` 임시 프로브 · 응답 시각 2026-09-10 01:02Z).
#
# ⛔ 이 목록을 성과를 보고 갈아 끼우지 않는다. 모델을 바꾸면 **새 참가자**이고
#    표본을 새로 쌓는다 (§5.6.2 자동조율 금지의 LLM 판 · G-AI-5).
#    ⚠️ 지금의 교체는 성과가 아니라 **존재 여부** 때문이므로 그 금지에 걸리지 않는다. 실험(T249 스위치)은
#       아직 켜지지 않았다.
#
# 🔴 검증은 `scripts/research/verify_llm_pool.py` 로 한다. 폐기 모델을 조용히 두면 그 모델이
#    "항상 무효응답" 으로 기록되어 비교표가 거짓말한다 (절대 규칙 #8). 채팅은 폐기 모델을 만나면
#    폴백 사슬을 걷는데, 2026-09-10 실측에서 죽은 모델 7종 + 타임아웃 2회를 걷느라 한 질문에 3.5분이 갔다.
#
# ⚠️ **`/v1/models` 목록에 있어도 호출은 안 될 수 있다.** 배포된 추론 함수가 없으면
#    404 `Function ... not found` 가 온다 (2026-09-10 에도 llama-3.1-nemotron 계열 · kimi-k2.6 · nemotron-4 가 그랬다).
#    목록은 필요조건이지 충분조건이 아니므로, 아래는 전부 **실호출로** 확인했다.
#
# ⚠️ 콜드 스타트 지연 편차가 크다 (실측 0.65초 ~ 109초). 첫 호출로 모델 속도를
#    판단하면 안 된다 — 비교표의 지연은 **웜 호출**로 재야 한다.

endpoint: https://integrate.api.nvidia.com/v1/chat/completions

fanout:
  # ⚠️ 90초로는 부족했다 — 콜드 스타트가 60초를 넘기는 모델이 있다.
  #    타임아웃이 짧으면 "느린 모델" 이 "죽은 모델" 로 기록된다.
  timeout_seconds: 180
  max_concurrency: 10
  schema_retries: 1
  temperature: 0.2

models:
  - id: nvidia/nemotron-3-super-120b-a12b
    rank: 1
    note: 중간 티어 · 도구 호출 2.2초(웜). 채팅 기본 (사용자 지정 · 2026-09-10 실호출 확인)

  - id: nvidia/nemotron-3-ultra-550b-a55b
    rank: 2
    note: 1M 컨텍스트 · 에이전트 특화 · 도구 호출 57초(콜드). 멀티 TF 페이로드용 (사용자 지정 · 실호출 확인)

  - id: openai/gpt-oss-20b
    rank: 3
    note: "대체 — gpt-oss-120b 는 410 폐기. 같은 계열 소형판 · 도구 호출 2.6초. **JSON 출력 안정성 비교군** 자리"

  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    rank: 4
    note: "대체 — 추론형 자리(inkling 410). 도구 호출 2.3초. **소형 대조군** 겸 (nemotron-nano-9b 410)"

  - id: nvidia/nemotron-3.5-lightning-30b-a3b
    rank: 5
    note: "대체 — 경량 3.5 세대 · 도구 호출 21초(콜드). 교차검증용 두 번째 의견 자리(minimax-m3 410)"

  - id: google/gemma-4-31b-it
    rank: 6
    note: "대체 — 범용 기준선 자리(llama-3.3-70b 410). 도구 호출 29초(콜드). NVIDIA 밖 계열 하나는 남긴다"

# 채팅(T248) — 도구 호출 대화가 먼저 부를 모델 · 한 턴 타임아웃. 폐기·오류·타임아웃이면 풀 순서대로 폴백한다.
#   ⚠️ 채팅 참가자(모델 x 프롬프트 x 스냅샷)의 성능은 T249 가 잰다 — 여기 값은 "살아 있어서" 고른 것이다.
#   T249 첫 토너먼트 후보(권장 3) = rank 1·2·3.
chat:
  model: nvidia/nemotron-3-super-120b-a12b
  timeout_seconds: 60

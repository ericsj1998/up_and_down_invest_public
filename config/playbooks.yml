# 플레이북 선언 — 매매법의 단일 출처.
#
# 공개본에는 **예시 매매법 하나**만 있다: 이동평균 교차(SMA20/50) · 손절 2xATR · 목표 2R. 표준 교과서 규칙이고
# 측정된 성과는 없다 — 플랫폼이 어떻게 도는지 보여 주는 견본이다. 실제 매매법은 이 파일과 같은 모양의 선언 +
# 탐지기 모듈 하나 + `pyproject.toml` 의 entry point 한 줄로 붙는다 (`docs/platform/strategy_authoring.md`).
#
# 🔴 version 은 측정 전에 고정한다. 구성을 바꾸면 **새 버전**이고 새 후보다 — 같은 이름으로 두면 옛 성적과
#    새 성적이 한 줄에 섞인다.
#
# ⭐ listed: true 인 플레이북만 콘솔 선택창에 보인다. recommended: true 가 기본 선택이다.

playbooks:
  # 차트 주문 — 사람이 주체인 판. 자동 판단이 없는 플랫폼 기능이라 매매법이 아니다 (setups 비어 있음).
  custom:
    version: "1.0.0"
    listed: false
    recommended: false
    label: "차트 주문 — 사람이 주체인 판 (자동 판단 없음)"
    market_groups: [코인]
    # ⚠️ 판정 축이 없다는 뜻이 아니라, **차트가 보던 축**을 그대로 쓴다는 뜻이다.
    timeframe: 4h
    regimes: [RANGE, UPTREND, DOWNTREND]
    primary_family: TREND
    primary_flags: []
    setups: []
    relever: false

  sample_ma_cross:
    version: "0.1.0"
    listed: true
    recommended: true
    leverage: 2
    label: 예시 · 이동평균 교차 0.1.0 (SMA20/50 · 손절 2xATR · 목표 2R · 측정 없음)
    market_groups: [코인]
    timeframe: 4h
    regimes: [RANGE, UPTREND, DOWNTREND]
    primary_family: TREND
    primary_flags: [setup.sample_ma_cross]
    setups: [sample_ma_cross]
    risk_pct: "0.005"

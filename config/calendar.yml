# 주요 일정 달력 — 무엇을 보여 줄지 (T276 · 2026-09-13)
#
# 지표 발표 예정일은 FRED `/fred/release/dates?release_id=…` 에서 온다(발표 하나에 호출 하나 · 응답은 날짜 몇 줄).
# 전체 목록 끝점(`/fred/releases/dates`)은 332개 발표가 섞여 하루 25행이라 쓰지 않는다.
# id 는 FRED `/fred/releases` 의 것이고 2026-09-13 실호출로 확인했다(다음 CPI 10-14 · 고용 10-02 · PCE 09-30).
# 이름·링크는 우리가 붙였다(링크는 FRED 가 알려 준 발표 기관 페이지).
#
# time 은 발표 시각 — **뉴욕 현지시각**(America/New_York · tz DB 가 서머타임을 안다 · 규칙 #7). 서버가 UTC 로 바꿔
# 화면에 카운트다운을 준다. history 는 과거 반응 표의 열쇠(`config/evidence/event_history.json` · 연구 PC 가 만든다).
#
# 🔴 여기 없는 발표는 화면에 안 나온다. 늘리려면 id 를 확인하고 한 줄 더한다.
# ⛔ FRED 101(FOMC Press Release)은 **매일** 한 줄이 나온다 — 일정이 아니라 "자료가 갱신되는 날" 이다. 그래서
#    금리 결정은 아래 `fomc` 에 연준이 공표한 회의 날짜를 적는다.
fred:
  releases:
    - id: 10
      label: 미국 CPI
      note: 소비자물가지수 — 인플레이션의 대표 지표. BLS 가 낸다
      url: https://www.bls.gov/cpi/
      time: "08:30"
      history: cpi
    - id: 54
      label: 미국 PCE 물가
      note: 개인소득·소비 — 연준이 보는 물가 지표(BEA)
      url: https://www.bea.gov/data/income-saving/personal-income
      time: "08:30"
    - id: 50
      label: 미국 고용
      note: 비농업 고용·실업률 (Employment Situation · BLS)
      url: https://www.bls.gov/ces/
      time: "08:30"
      history: jobs
fomc:
  # 연준 FOMC 회의 — 둘째 날이 결정·성명 발표일이다. 출처는 연준 공표 일정(아래 url).
  # 🔴 API 가 없다(FRED 101 은 위 이유로 못 쓴다). 연준 페이지를 읽어 이 목록을 다시 쓰는 배치가 있다 —
  #    `make sync-fomc` (scripts/ops/sync_fomc.py) · GitHub Actions 가 달마다 돌려 바뀌면 커밋한다.
  #    아래 줄은 그 배치가 쓴다. 손으로 고치면 다음 배치가 페이지 값으로 되돌린다.
  label: FOMC 금리 결정
  note: 연준 정책 발표문 — 기준금리와 성명 (회의 둘째 날)
  url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  time: "14:00"
  history: fomc
  dates:
    - 2026-01-28
    - 2026-03-18
    - 2026-04-29
    - 2026-06-17
    - 2026-07-29
    - 2026-09-16
    - 2026-10-28
    - 2026-12-09
    - 2027-01-27
    - 2027-03-17
    - 2027-04-28
    - 2027-06-09
    - 2027-07-28
    - 2027-09-15
    - 2027-10-27
    - 2027-12-08
earnings:
  # 실적 예정은 유니버스(config/fundamentals/universe.yml) 종목만 보여 준다 — Finnhub 는 한 번에
  # 전 종목을 주므로 **호출은 한 번**이고 여기서 거른다. (착수 전 #4 · 2026-09-13)
  scope: universe
  # Finnhub `hour` → 대략의 뉴욕 현지시각. 회사마다 다르다 — bmo 는 06:00~08:30, amc 는 16:00~16:30 사이가 보통.
  # 없는 값(dmh · 빈 칸)은 시각을 모른다고 두고 카운트다운을 안 건다.
  hours:
    bmo: "07:00"
    amc: "16:05"
# 앞으로 며칠까지 (화면 기본값 · 요청 `days` 로 90 까지). CPI 는 한 달에 한 번이라 14일이면 자주 비어 보인다.
days_ahead: 30

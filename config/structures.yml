# 구조물 공용 모듈 파라미터 (P1-1 · spec §4.3.1, §6.4, §6.5)
#
# ⚠️ 이 값들은 **표준 이론값이다. 성과를 보고 미세조정하지 않는다** (spec §5.6.1 ②).
#    바꿀 때는 사람이 백테스트로 검증하고 `rule_version` 을 올린다 (spec §5.6.2).
#    골든 스냅샷이 이 값에 묶여 있으므로, 값을 바꾸면 스냅샷도 갱신해야 한다
#    (절차: docs/rules/structure_rules.md §6).

rule_version: "structures@1.0.0"

swing:
  # Bill Williams 5봉 프랙탈의 표준값 — 좌 2봉 / 우 2봉.
  # 넓히면 스윙이 줄어 추세선 접점이 부족해지고, 좁히면 노이즈가 스윙이 된다.
  # 어느 쪽도 "성과를 보고" 정하지 않는다.
  left_bars: 2
  right_bars: 2

trendline:
  # 고전 기술적분석의 표준 — 2점으로 긋고 **3번째 접점이 유효성을 증명**한다.
  min_touches: 3
  # 접점 인정 허용 오차 — **그 봉의 ATR 배수** (P1-6-9 전환, Phase01 §1-0h).
  #
  # 고정 %를 버린 이유는 실측이다: 같은 0.2% 가 1h 에서 0.407xATR, 5m 에서 1.671xATR —
  # **시간축 사이에서 4.1배 다른 뜻**이고 한 시간축 안에서도 저·고변동 구간이 2배 넘게
  # 벌어진다. 5m 추세선 터치율(82.5%)이 1h(52.6%)보다 높았던 것이 이 왜곡의 결과였다.
  #
  # 0.25 의 근거는 **형태**다 — "닿았다"는 판정은 봉 범위의 1/4 이내로 본다.
  # 성과와 무관한 논거이며, 그것이 이 값을 고른 이유다 (rule_candidates 축 I1).
  # ⛔ 성과로 조정하지 않는다 (§5.6.2). 선언 후 측정 결과를 수용했고 되돌리지 않는다.
  touch_atr_multiple: 0.25
  # 몸통 이탈 허용 개수. §6.5 는 "몸통은 선 위, 꼬리는 걸려도 된다"이므로 0 이다.
  max_body_violations: 0
  # 두 앵커 사이 최소 봉 간격 — 붙어 있는 두 스윙을 이은 선은 추세가 아니다.
  min_anchor_distance_bars: 5

channel:
  # 평행 채널이 채널이려면 반대편도 닿아야 한다. 2점이 최소다.
  min_opposite_touches: 2

box:
  # 박스(수평 지지·저항)로 묶을 허용 오차 — 추세선 접점과 **같은 배수**를 쓴다.
  # 둘은 같은 "닿았다" 판정이므로 기준이 갈리면 설명할 수 없다.
  cluster_atr_multiple: 0.25
  # 수평선도 최소 2번은 닿아야 레벨이다.
  min_touches: 2

confluence:
  # 합류 판정 시 "이 가격대에 걸렸다"고 볼 허용 오차 — **ATR 배수**.
  #
  # 접점(0.25)의 **2배**다. 전환 전 `0.001 : 0.002` 관계를 그대로 보존했다 — 합류는
  # "서로 다른 구조물이 같은 가격대에 있다"를 보므로 접점보다 넓은 것이 맞고, 그 비율을
  # 새로 정하지 않으려고 기존 관계를 유지했다 (새 자유도 최소화).
  zone_atr_multiple: 0.5
  # ⚠️ 구조물 종류별 가중치를 두지 않는다 — spec §5.6.4.
  #    가중치는 백테스트 산출값이어야 하고(§5.5) 표본 30건 전에는 균등이다(§12.9).
  #    지금 숫자를 넣으면 그것이 곧 근거 없는 과최적화다.

# 봉 보관 정책 (T278 · 2026-09-12)
#
# 서버는 화면·RUN 이 쓰는 창만 들고, 연구 PC 는 안 지운다(사용자 확정 2026-09-12).
# 기간은 실제로 읽는 창에서 나왔다 — 줄이려면 그 창부터 본다.
#
# 🔴 `never_delete` 는 **안전장치**다. 여기 적힌 축은 `keep_days` 에 넣어도 계획에 안 들어간다.
#    일봉은 가장 가볍고(서버 14.8만 행) 가장 오래 쓰인다 — 저평가 순위·장투·재무가 읽는다.
candles:
  keep_days:
    # 축: 남길 일수 — 그 이전 봉은 지울 대상
    5m: 60 # RUN 시작 2.8일 · 야간 예열 7일 → 여덟 배 여유
    15m: 180 # 차트 분석 주문 단기 창 약 30일 → 여섯 배
    1h: 400 # 스윙 창 약 130일 → 세 배
    4h: 400 # AI 비교 맥락 축 약 66일 · 가볍다(서버 2.9만 행)
  never_delete:
    - 1d
    # 주봉(1w)은 아직 `Timeframe` 에 없다 (P3 장투 때 추가). 생기면 여기에 넣는다 —
    # 모르는 축 이름은 일부러 예외다(오타가 조용히 통과하면 자물쇠가 안 걸린다).

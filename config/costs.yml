    #
    #    `DEFAULT_TICK = 500` 은 **원화 상수**였다. 업비트 BTC 9,010만원에서 0.00056%
    #    지만 Gate BTC_USDT 64,300 에서는 **0.78%** — 5,000배 굵다.
    #
    #    그 결과 **숏 계획이 통째로 무너졌다.** 상단 스마트 띠 폭이 중앙값 44.4 인데
    #    눈금이 500 이라 띠 전체가 한 칸에 들어가고, 1차 익절(띠 아랫변)과 2차(띠 윗변)가
    #    같은 값이 되어 `plan_for` 가 거부한다:
    #
    #      최근 60봉 · 숏 방아쇠 21건 → 계획이 선 것 **1건**
    #      눈금을 0.5 로 내리면        → 21건 전부 성립 · 뒤 게이트까지 18건
    #
    #    ⛔ **반올림 방향 문제가 아니다.** 올림으로 바꿔도 1건이다 (실측).
    #
    # ⭐ **0.5 를 고른 근거는 "업비트 시절과 같은 촘촘함"** 이다 (사용자 지시).
    #
    #      업비트 500원 / 그 시절 가격 126,628,849  =  0.000395%  → Gate 에서 0.3
    #      업비트 500원 / 지금 가격    90,104,500   =  0.000555%  → Gate 에서 0.4
    #      업비트 **실제 틱** 1,000 / 지금 가격      =  0.001110%  → Gate 에서 0.7
    #
    #    0.5 는 그 셋의 가운데이고 Gate 최소 단위 0.1 의 배수다. 0.3~0.7 어디를 골라도
    #    측정 결과가 같았다 — 띠 폭보다 충분히 작기만 하면 되기 때문이다.
    #
    # ⚠️ **거래소 최소 단위(0.1)까지 내리지 않는다.** 이 눈금의 원래 목적은 주문
    #    가능성만이 아니라 **노이즈 제거**다 — 눈금이 없으면 같은 박스가 매 봉 다른
    #    셋업으로 세어져 표본이 부풀려진다 (`DEFAULT_TICK` 주석: 관측 396건 중 286건이
    #    서로 다른 셋업). 업비트와 같은 **상대 강도**를 유지하는 것이 목적이다.
    #
    # ⚠️ 실측 근거: `order_price_round` = 0.1 (계약 명세) · 호가창 20단계 간격 최소 0.1 ·

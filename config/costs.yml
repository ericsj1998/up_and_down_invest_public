    #
    #    SPCX_USDT 에 5,642 계약(증거금 420)이 묶였다. 화면의 모든 숫자가 멀쩡했다 —
    #    가격도 손익도 청산가도 전부 **표시가** 기준이었기 때문이다. 그런데:
    #
    #      표시가(index 기반)   139.06
    #      최고 매수호가         108      ← 팔려면 여기를 때려야 한다
    #      최저 매도호가         138      ← 사기는 쉬웠다
    #
    #    **한쪽만 두꺼운 시장**이라 들어가긴 쉽고 나오긴 불가능했다. Gate 는 표시가에서
    #    20% 넘게 벗어난 주문을 아예 안 받으므로(`deviation-rate limit 0.2`), 최저 매도
    #    가능가 111.25 와 유일한 매수자 108 이 **3.25 차이로 영영 안 만난다.**
    #
    # ⚠️ **깊이 총합을 보면 안 된다.** 지금 SPCX 는 매도 쪽에 33만 계약이 쌓여 있어서
    #    합계만 재면 아주 건강해 보인다 — **양쪽을 따로** 봐야 한다.
    liquidity:
      # 표시가에서 이만큼(%) 넘게 벌어진 호가는 **없는 것으로 본다**.
      #
      # ⭐ 5 는 자의적인 값이 아니다 — Gate 시장가 슬립 방어가 정확히 이 값이다
      #   (실측 거절 문구: `slip ratio 0.05`). 그보다 나쁜 호가는 **시장가로 못 넘는다** =
      #   급할 때 나갈 수 없다는 뜻이고, 그것이 이 검사가 막으려는 상태다.
      max_gap_pct: 5.0

      # 그 안에 **내 명목의 몇 배**가 쌓여 있어야 하나.
      #
      # ⚠️ 1.0 은 "딱 내 크기만큼" 이다. 그마저 없으면 내가 나갈 때 호가를 다 먹고
      #    그 아래로 미끄러진다.
      depth_multiple: 1.0

      # 표시가에서 이만큼(%) 넘게 벗어난 **지정가는 거래소가 아예 안 받는다**.
      #
      # 🔴 이것이 SPCX 를 15시간 가둔 벽이다 (2026-08-20 실측):
      #
      #     표시가 139.06 → 걸 수 있는 최저가 111.25
      #     유일한 매수자 108
      #     3.25 차이로 영영 안 만났다
      #
      # ⭐ 우리 문턱이 아니라 **Gate 의 규칙**이다 (거절 문구 `deviation-rate limit 0.2`).
      #    그래서 우리가 고를 값이 아니고, 탈출 지정가를 계산할 때 **넘으면 거절**당하는
      #    한계선으로 쓴다.
      order_deviation_pct: 20.0


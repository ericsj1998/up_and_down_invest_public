# 거래 비용 테이블 (spec §12.7 · P1 §5-1)
#
# ⚠️ **수치를 코드에 박지 않는다** (CLAUDE.md 규약 1). 수수료율·세율은 거래소·세제가
#    바꾸는 값이고, 백테스트·페이퍼·RiskManager 가 **같은 테이블**을 봐야 한다.
#
# ⛔ **비용을 낮춰 전략을 살리지 않는다.** 필요 승률이 안 나온다고 슬리피지를 내리면
#    그것은 전략 개선이 아니라 분모 조작이다 (§5.6.2 와 같은 정신). 값을 바꾸려면
#    `source` 와 `measured_at` 을 함께 갱신해야 하며, 그것이 이 파일의 강제 필드다.
#
# ⚠️ **과거 스프레드는 측정할 수 없다.** 업비트 공개 API 는 현재 호가만 준다. 여기의
#    실측치를 백테스트 구간(2025-08~2026-08)에 적용하는 것 자체가 새 가정이다. 그래서
#    판정의 최종 근거는 이 값이 아니라 **손익분기 슬리피지 대비 여유 배수**다
#    (`common/costs.py` → `breakeven_slippage`).

# ⭐ **UPBIT 확정 왕복 비용 = 0.157%** (= 수수료 0.05% x2 + 슬리피지 0.0286% x2).
#    D1-6 가정(0.30%)을 실측으로 교체했다 — 가정의 **52%** 다.
#    성분표와 이중 계산 정정은 Phase01 §1-0b / §1-0b-1 에 있다.

markets:
  UPBIT:
    # 업비트 원화마켓 수수료 — 메이커·테이커 동일 0.05% (편도).
    # 공표 수치이므로 실측 대상이 아니다.
    fee_pct: 0.0005

    # 코인은 거래세가 없다. (주식은 P2-9 에서 KRX 항목을 추가할 때 채운다.)
    tax_pct_sell: 0.0

    # 편도 슬리피지 = 스프레드/2 + 깊이충격. **mid 기준**이다 —
    # 체결가끼리 비교하면 bid-ask bounce 때문에 스프레드를 두 번 세게 된다.
    #
    # ⛔ **폴링 지연 항을 여기 더하지 않는다.** D1-6 원안이 그렇게 했고 그것이 이중
    #    계산이었다 (§1-0b). 연속 체결은 매수·매도 호가를 번갈아 때리므로 "N초 후 이동"은
    #    어떤 간격으로 재도 스프레드만큼 나온다. 지연이 더하는 것은 방향성 드리프트이며
    #    호가창 스냅샷으로는 측정되지 않는 별개 항이다.
    #
    # 값의 선택: **현실 규모(1천만원)에서 가장 비싼 종목의 중앙값**이다.
    # 이 한 줄이 모든 코인에 적용되므로 종목 간 평균을 쓰면 비싼 종목이 조용히 과소
    # 계상된다 (실측에서 ETH 2.86bp vs BTC 1.13bp — 2.5배 차이).
    #
    # 🔜 **24시간 측정이 끝나면 이 값과 `source` 를 갱신한다.** 지금은 19시 KST 단일
    #    시간대 40분 표본이라 "새벽에 스프레드가 벌어지는가"에 답하지 못한다.
    #    진행 상황: `make progress` 의 `costs_24h`.
    #    갱신 절차: `scripts/runtime/measure_costs.py` 가 찍어 주는 블록을 그대로 붙이고,
    #    `measured_at` 을 새 측정 시각으로 바꾼다 (손으로 자릿수를 옮기지 않는다).
    slippage_pct_one_way: 0.00028606
    slippage_source: measured
    measured_at: 2026-08-06T10:19:22Z
    source: >-
      업비트 /orderbook 30단계 스냅샷 960건 (KRW-BTC·KRW-ETH x 1천만·5천만원,
      2026-08-06 19:19 KST 부터 40분, 10초 간격). 거부 0건.
      채택값 = KRW-ETH 1천만원 편도 **중앙 2.86bp** (= 스프레드/2 1.85 + 깊이충격 0.85).
      같은 조건 KRW-BTC 는 1.13bp (스프레드/2 0.33 + 깊이충격 0.61).
      분포: ETH p90 4.55bp · 최대 6.63bp / BTC p90 3.32bp · 최대 4.68bp.
      5천만원으로 키우면 깊이충격이 지배한다 — ETH 5.34bp · BTC 3.39bp.
      ⚠️ **40분 단일 시간대(19시 KST) 표본이다.** 시간대별 분포는 24시간 측정
      (`scripts/research/launch_cost_measurement.sh daily`)이 끝나면 이 항목을 갱신한다.
      ⚠️ **과거 스프레드는 측정 불가**이므로 이 값을 백테스트 구간에 적용하는 것 자체가
      새 가정이다. 판정의 최종 근거는 이 수치가 아니라 손익분기 슬리피지 대비 여유
      배수다 (common/costs.py → breakeven_slippage).
      ⚠️ 5천만원 매수는 30단계로 채워지는데 **매도는 240건 중 11건이 못 채웠다**
      (BTC). 호가 깊이가 비대칭이라 청산이 진입보다 어렵다 — P2 포지션 사이징 사안.

  # ─────────────────────────────────────────────────────────────────────
  # KRX — 2026-08-07 채움 (방향 전환 §1-0j 로 주식이 P1 검증 대상이 됐다)
  # ─────────────────────────────────────────────────────────────────────
  KRX:
    # 사용자가 확인한 **계좌 실제 수수료율**이다 (KRX 체결 기준).
    # NXT(대체거래소) 체결은 0.014% 로 더 싸지만, 어느 거래소에서 체결될지는
    # 사전에 알 수 없으므로 **비싼 쪽**을 쓴다 — 비용을 낙관하지 않는다.
    fee_pct: 0.00015

    # 증권거래세 + 농어촌특별세, **매도 시에만** 부과된다.
    #
    # ⚠️ 이 값은 사용자 확인값이 아니라 **제도값**이다. 세율은 정책으로 바뀌므로
    #    (2023년 0.20% → 2024년 0.18% → 2025년 0.15%) 연 1회 확인이 필요하다.
    #    바뀌면 여기와 `measured_at` 을 함께 고친다.
    tax_pct_sell: 0.0015

    # 실측 — 코인과 **같은 방법**(`common/costs.sample_slippage`, mid 기준)이라
    # 두 시장의 수치가 같은 정의다.
    slippage_pct_one_way: 0.00106952
    slippage_source: measured
    measured_at: "2026-08-07T03:10:43Z"
    source: |
      토스 /api/v1/orderbook 실측 (2026-08-07 12:07~12:10 KST · 정규장 중).
      1,000만원 주문 기준 편도 중앙값, 표본 30(005930) / 26(000660).

        005930  편도 10.70bp (스프레드 21.39bp)   ← 채택
        000660  편도  3.47bp (스프레드  6.93bp)

      채택값은 **가장 비싼 종목의 중앙값**이다. 비용 테이블 한 줄이 KRX 전체에
      적용되므로 종목 간 평균을 쓰면 비싼 종목이 조용히 과소 계상된다 (UPBIT 와
      같은 원칙).

      ⚠️ **코인의 32배다** (BTC 편도 0.33bp vs 삼성전자 10.70bp). 왕복으로 보면
      KRX 0.244% vs 업비트 0.157% 이고, 좁은 손절에서는 이 차이가 R 로 증폭된다
      (`orchestration/backtest/equity.py` 의 비용 환산).

      ⚠️ 표본이 **10분치 한 구간**이다. 코인(960샘플·40분)보다 얇고 시간대 분산이
      없다 — 개장 직후·마감 직전은 더 넓을 수 있다. 판정을 좌우할 상황이면
      `breakeven_slippage()` 로 여유 배수를 먼저 본다.

      교차 호가(bid == ask) 표본 4건은 제외했다 (000660). 동시호가 구간으로 보인다.

  # ─────────────────────────────────────────────────────────────────────
  # NASDAQ — 수수료는 사용자 확인, 슬리피지는 **미측정**
  # ─────────────────────────────────────────────────────────────────────
  NASDAQ:
    # 사용자가 확인한 계좌 실제 수수료율 (해외주식).
    fee_pct: 0.001

    # 미국 주식 매도 시 SEC fee·FINRA TAF 가 붙지만 요율이 수시로 바뀌고
    # 공표 근거를 확인하지 못했다. **0 으로 두되 이 사실을 남긴다** — 0 이 "없다"가
    # 아니라 "아직 못 채웠다"임을 아래 source 가 밝힌다.
    tax_pct_sell: 0.0

    # 호가단위 — 미국 주식은 $1 이상이면 $0.01 (Reg NMS Rule 612 · 토스 명세 tick: broker · T240 2026-09-09).
    #   라이브 조립부가 tick 을 모르면 판을 안 띄운다(원화 기본값 500 으로 안 떨어진다).
    price_tick: 0.01

    # ⚠️ **가정값이다.** 측정 시도 시각(2026-08-07 12시 KST)에 미국 장이 닫혀 있어
    #    호가를 뜰 수 없었다. KRX 실측치를 그대로 옮겼다.
    slippage_pct_one_way: 0.00106952
    slippage_source: assumed
    source: |
      수수료 0.1% 는 사용자 확인값 (2026-08-07).

      🔴 **슬리피지는 측정하지 못했다.** KRX 실측치(10.70bp)를 옮겨 쓴 자리표시자다.
      미국 대형주는 유동성이 KRX 보다 좋아 실제로는 **더 낮을 가능성이 크므로**
      이 값은 보수적(불리한) 쪽이다 — 그래도 가정은 가정이다.

      측정하려면 미국 정규장(22:30~05:00 KST · 서머타임 시 21:30~04:00)에
      `scripts/runtime/measure_costs.py` 를 NASDAQ 대상으로 돌린다.

      ⚠️ 이 값으로 낸 미국 종목 판정은 **`slippage_source: assumed` 라는 사실과
      함께** 읽어야 한다. §12.7 이 출처를 강제하는 이유가 이것이다.

  # ─────────────────────────────────────────────────────────────────────
  # NYSE — NASDAQ 과 같은 계좌·같은 브로커(토스 해외주식) · 슬리피지 **미측정** (2026-09-11)
  #
  # 유니버스(T260)에 NYSE 61종이 들어왔고 AI 차트 분석 주문의 주식 기본값이 SPY·NYSE 라
  # 블록이 없으면 `for_market` 예외 → 화면 500 이었다. 값은 NASDAQ 자리표시자를 그대로 —
  # 수수료 0.1% 는 해외주식 계좌 요율이고 슬리피지는 KRX 실측치를 옮긴 가정값이다.
  # ─────────────────────────────────────────────────────────────────────
  NYSE:
    fee_pct: 0.001
    tax_pct_sell: 0.0
    price_tick: 0.01
    slippage_pct_one_way: 0.00106952
    slippage_source: assumed
    source: |
      NASDAQ 블록과 같은 자리표시자 (2026-09-11). 수수료 0.1% 는 사용자 확인값(해외주식 계좌 ·
      2026-08-07). 🔴 슬리피지는 미측정 — KRX 실측치(10.70bp)를 옮겼다. 미국 정규장에
      `scripts/runtime/measure_costs.py` 를 NYSE 대상으로 돌리면 채워진다.

  # ─────────────────────────────────────────────────────────────────────
  # GATE — Gate.io BTC_USDT **무기한 선물** (2026-08-17 채움)
  #
  # 🔴 첫 라이브 대상이다. 숏·레버리지가 여기서만 열리므로 양방향 플레이북(숏 19건,
  #    전체의 24%)을 **그대로** 돌릴 수 있는 유일한 시장이다 — 업비트 현물로는 못 돈다.
  # ─────────────────────────────────────────────────────────────────────
  GATE:
    # **테이커 편도** 수수료다 (`/futures/usdt/contracts/BTC_USDT` → `taker_fee_rate`).
    #
    # ⚠️ **메이커는 −0.01% (리베이트)** 다. 그래서 실제 왕복은 이 값의 2배보다 싸다 —
    #    0.1 은 진입만 시장가(테이커)이고 반익·목표·손절은 지정가라 청산 다리가
    #    메이커로 붙는다.
    #
    #      전부 테이커      왕복 0.1500% + 슬리피지
    #      진입만 테이커    왕복 0.0650% + 슬리피지   ← 실제 구조
    #
    # ⛔ 그런데 **여기에 그 이득을 적지 않는다.** `fee_pct` 는 한 칸이고 왕복을 x2 로
    #    계산하므로, 메이커를 반영하려면 비용 **모델**을 바꿔야 한다. 그것은 `RISK_FLOOR`
    #    등 판정값 전부를 다시 계산한다는 뜻이고, 매매 로직 동결 지시에 걸린다
    #    (사용자 확정 2026-08-17). 보수적인 쪽(전부 테이커)으로 두면 **이 값으로 되는
    #    전략은 실제로 더 된다** — 반대 방향의 오차만 위험하다.
    #
    # ✅ **모델을 넓혔다** (2026-08-17). `taker_fee_pct`/`maker_fee_pct`/
    #    `funding_pct_per_8h` 칸이 아래에 있고, `entry_taker_round_trip_pct` 가 진입만
    #    테이커인 왕복을 계산한다.
    #
    # ⛔ 그래도 `fee_pct` 는 그대로 두고 `round_trip_pct` 도 이것만 쓴다 — 판정값을
    #    움직이면 지금까지의 실측이 무엇의 성적인지 알 수 없다 (매매 로직 동결).
    #
    # 🔜 남은 일: **결과별로 다르게 세기** (목표익절=메이커 / 손절=테이커). 지금
    #    `entry_taker_round_trip_pct` 는 청산이 전부 메이커라 가정해서 손절로 끝난
    #    거래에는 낙관적이다.
    fee_pct: 0.00075

    # ✅ **결정 (2026-08-22 · 사용자 확정 · T42 ④): 실현 손익은 체결 유형대로 센다.**
    #
    #    `round_trip_pct`(이 칸 × 2 = 0.15%)는 **관문**(RISK_FLOOR · COST_COVER · SPAN_COVER)에만
    #    남고, 실현 손익은 `round_trip_by(진입 메이커?, 청산 메이커?)` 로 아래 실제 요율을 쓴다 —
    #    지정가 진입 + 지정가 익절 0.04% · 지정가 진입 + 시장가 손절 0.07%.
    #    백테스트는 `--cost fill`, 라이브 원장은 `Session.fill_cost = True`.
    #
    #    이것은 값을 낮춰 전략을 살리는 것이 아니라 **자를 바로 잡는 것**이다: 0.5 부터 진입이
    #    지정가인데 모델은 0.1(시장가) 시절의 전부-테이커 가정을 들고 있었다. 실측(2026-08-22)에서
    #    298건 × 0.15% = 45% 로 찍히던 수수료가 실제로는 15~20% 다.
    #    ⛔ 옛 표(flat)와 새 표(fill)는 한 줄에 섞지 않는다 — lab 꼬리표 `·fill` 이 가른다.

    # ⭐ **실제 계정 요율** (주문 응답 tkfr/mkfr · 실측 2026-08-17 testnet).
    #
    #    ⛔ `round_trip_pct` 는 여전히 `fee_pct` 만 쓴다 — 판정값을 움직이지 않는다.
    #      이 칸들은 `entry_taker_round_trip_pct` 와 `funding_cost_pct` 가 읽으며,
    #      판정에 쓸지는 별도 결정이다 (§5.6.2).
    #
    #    ⚠️ **메이커가 양수다** (내는 돈). 계약 명세의 -0.0001(리베이트)로 계산하면
    #      청산 다리가 돈을 받는 것으로 잡힌다 — 낙관 방향의 오차다.
    taker_fee_pct: 0.0005
    maker_fee_pct: 0.0002
    funding_pct_per_8h: 0.0001

    # 코인·선물은 거래세가 없다.
    tax_pct_sell: 0.0

    # 🔴 **계약 명세와 주문 응답이 다르다** (실측 2026-08-17 · testnet):
    #
    #      /futures/usdt/contracts/BTC_USDT  →  taker 0.00075 · maker -0.0001
    #      주문 응답 tkfr / mkfr             →  taker 0.0005  · maker  0.0002
    #
    #    계약 명세는 **기준 요율**이고 주문 응답이 **이 계정이 실제로 내는 값**이다.
    #    VIP 등급·GT 차감·수수료 이벤트가 계정별로 다르므로, 비용 판정은 주문 응답을
    #    봐야 한다 (`GateTradeClient.fees_from`).
    #
    #    ⚠️ **메이커가 양수다.** 명세의 -0.0001(리베이트)로 계산하면 청산 다리가 돈을
    #      받는 것으로 잡히는데 실제로는 낸다 — 낙관 방향의 오차다.
    #
    #    ⛔ 그런데 여기 값을 **바꾸지 않는다.** 0.00075 가 실제(0.0005)보다 비싸므로
    #      보수적이고, 판정값을 움직이면 지금까지의 실측이 무엇의 성적인지 알 수 없게
    #      된다 (매매 로직 동결 · 사용자 확정 2026-08-17).
    #
    #    🔜 실제 요율로 다시 재면 이렇게 된다 — **모델을 넓힐 때 함께 갱신한다**:
    #
    #      전부 테이커     왕복 0.1000%  (지금 표는 0.1500%)
    #      진입만 테이커   왕복 0.0700%  (0.05% + 0.02%)
    #
    #    ⚠️ testnet 요율이다. 라이브 계정은 등급이 달라 또 다를 수 있으므로, 라이브
    #      첫 주문 응답에서 다시 읽어 확인한다.

    # ⭐ 펀딩(T226 · 2026-09-07): 원장이 8시간 정산 경계마다 아래 `funding_pct_per_8h` 를 열린
    #    매매에 물린다(백테스트·페이퍼). 라이브는 거래소 정산 기록을 그대로 붙인다.

    # 편도 슬리피지 = 스프레드/2 + 깊이충격. **mid 기준** — 업비트와 같은 정의다
    # (`common/costs.sample_slippage`). 두 시장 수치가 같은 정의여야 비교가 된다.
    #
    # 🔴 **업비트의 1/362 다.** 실측(2026-08-17, 1106계약 = 1천만원 상당, 18회 x 10초):
    #
    #      스프레드/2 · 매수 편도 · 매도 편도 — 전부 중앙 0.008bp
    #      중앙 = p90 = 최대 (완전히 안정) · 깊이충격 0 · 못 채운 횟수 0/36
    #
    #    호가가 늘 **1틱**(0.1 USDT / 63,265)이라서다. 최우선 호가에 11,000계약 넘게
    #    쌓여 있어 우리 규모(1106계약)는 한 단계에서 다 채워진다.
    #
    #    ⇒ 총비용에서 슬리피지가 사실상 사라지고 **수수료가 전부**가 된다.
    #      업비트 왕복 0.1572% vs GATE 왕복 0.1502% — 수수료가 3배인데 총액은 더 싸다.
    #
    # ⛔ **`measured` 로 적지 않는다.** 3분 단일 시간대 표본이다. 업비트 값도 40분
    #    960건이면서 "19시 단일 시간대" 경고가 붙어 있는데, 이건 그보다 작다.
    #    변동성 구간에서 무기한 스프레드가 벌어지는지에 답하지 못한다.
    #
    # 🔜 갱신: `scripts/runtime/measure_costs.py` 에 GATE 경로를 붙이고 24시간을 돌린 뒤
    #    `measured` 로 바꾼다. 그때 `measured_at` 도 함께 채운다.
    slippage_pct_one_way: 0.00000079
    slippage_source: assumed
    source: >-
      Gate.io /futures/usdt/order_book 50단계 스냅샷 18건 (BTC_USDT 무기한,
      1106계약 = 1천만원 상당, 2026-08-17, 10초 간격). 거부 0건 · 못 채운 횟수 0건.
      채택값 = 양방향 편도 **중앙 0.0079bp** (= 스프레드/2 0.0079 + 깊이충격 0.0000).
      분포가 없다 — 중앙·p90·최대가 모두 0.008bp 로 같다. 스프레드가 항상 1틱
      (order_price_round 0.1)이고 최우선 호가 규모가 주문의 10배라 깊이충격이 0 이다.
      같은 방법·같은 규모의 업비트 실측은 2.8606bp — **362배** 크다.
      계약 명세(같은 시각): quanto_multiplier 0.0001 · taker 0.075% · maker -0.01% ·
      maintenance_rate 0.3% · leverage_max 200 · funding 0.01%/8h.
      ⚠️ **3분 단일 시간대 표본이다.** 변동성 구간의 스프레드 확대를 담지 못한다.
      ⚠️ **펀딩비는 이 수치에 안 들어 있다** (구조에 칸이 없다 — 위 주석 참고).
      ⚠️ testnet 은 maintenance_rate 0.4% · leverage_max 125 로 라이브와 다르다.
      하드코딩하지 않고 API 에서 읽는다.


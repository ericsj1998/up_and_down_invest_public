# 리스크 정책 앵커 (P1-7-1 · spec §4.6 투자 성향 슬라이더, v1.9)
#
# ⚠️ **수치를 코드에 박지 않는다** (CLAUDE.md 규약 1, §4.3.1). 관리자 화면에서 보이고
#    커밋으로 이력이 남아야 한다 (D1-1: YAML 단일 소스).
#
# ⛔ **성과를 보고 조정하지 않는다** (§5.6.2). 이 값들은 사용자의 **성향 선언**이며
#    백테스트 결과로 움직이는 값이 아니다. "수익이 안 나서 리스크를 올린다"는 것은
#    전략 개선이 아니라 도박이다.

# 슬라이더 앵커 3개 — §4.6 표 그대로다.
#
# 3개를 유지하는 이유(§4.6): 프리셋 이름이 사용자에게 의미를 주고("나는 보수적"),
# 백테스트·관리자 설정의 기준점이 필요하다. 슬라이더는 그 사이를 메우는 것이지
# 앵커를 없애는 것이 아니다.
anchors:
  # 슬라이더 0.0 — 하단 끝점
  conservative:
    risk_pct: 0.005          # 0.5%
    min_rr: 2.0
    max_positions: 3
    daily_loss_limit_pct: -0.02   # -2%

  # 슬라이더 0.5 — 중간점이자 **기본값**
  standard:
    risk_pct: 0.01           # 1%
    min_rr: 1.75
    max_positions: 5
    daily_loss_limit_pct: -0.03

  # 슬라이더 1.0 — 상단 끝점
  #
  # 참고 산수(§4.6): 회당 3% 리스크로 5연속 손절 ≈ 계좌 -14%, 회당 10%면 -41%.
  # **상한을 3%로 묶는 근거**가 이 산수다.
  aggressive:
    risk_pct: 0.03           # 3%
    min_rr: 1.5
    max_positions: 8
    daily_loss_limit_pct: -0.06

# 회당 리스크 절대 상한 (§4.6 "슬라이더는 끝점을 넘어갈 수 없다").
#
# 앵커와 별도로 두는 이유: 앵커 수치를 나중에 조정하더라도 이 상한은 남아야 한다.
# 안전장치는 프리셋으로 끌 수 없다 (§4.6 불변 원칙).
risk_pct_hard_cap: 0.03

# ATR 손절 배수 k — §6.1 `stop = entry − k×ATR` (범위 1.5~3.0).
#
# ⭐ **하나로 확정하지 않고 후보 3개를 둔다** (2026-08-06, rule_candidates 축 G-k).
#    §6.1 이 범위만 주고 그 안의 위치는 **손절폭 vs 익절 도달의 트레이드오프 판단**이라
#    형태 논거로 정해지지 않는다. 억지 근거를 만드는 것보다 성과가 고르게 한다.
#
# ⛔ **여기가 k 의 유일한 자리다.** `config/rules/<setup>.yml` 에 k 를 넣지 않는다 —
#    셋업별로 k 를 가지면 그것이 "오더블록을 살리려 k 를 조작"하는 통로가 된다.
#    손절은 decision 소관이므로(절대 규칙 #4) 룰 설정에 있으면 계층도 어긋난다.
#    `tests/test_risk_policy.py` 가 룰 YAML 에 k 가 없는지 검사한다.
#
# ⛔ **P1-8 은 이 중 하나를 고르지 않는다.** 세 값 전부를 측정해 병기한다 —
#    지금 활성 룰이 order_block 하나뿐이라, 성과로 고르면 실질이 전용 튜닝이 된다.
#    정책값 확정은 셋업이 여러 개 활성화된 뒤다.
atr_stop_multiple_candidates: [1.5, 2.0, 2.5]

# ═══════════════════════════════════════════════════════════════════════════
# β — 손절을 **청산거리의 이 비율 안쪽**으로 당긴다 (T120~T146 · 2026-08-30)
#
# 🔴 진단이 가리킨 곳: 청산난 판의 **81~84%** 가 "손절이 청산보다 바깥"인 판이었다.
#    손절거리가 t=+13~16 으로 청산을 예측했고 ADX 도 보유기간도 아니었다.
#    6x 면 청산이 16.2% 인데 SMA200 트레일이 20% 밖에 서면 손절은 **장식**이다.
#
#    처방: `손절 상한 = 진입 ∓ β x 청산거리`. 조이는 방향으로만 작동한다 (규칙 #3).
#
# ⭐ 값은 **경로가 골랐다.** 6x 에서 4h 격자로는 β 0.40~0.85 가 다 청산 0 이었는데,
#    15m 경로로 풀면 **0.40 만** 청산 0 을 지켰다 (T146):
#
#      β0.40 (상한 6.5%)  4h 0 → 15m **0**  ✅
#      β0.55 (상한 8.9%)  4h 0 → 15m 1      ⛔
#      β0.70 (상한 11.3%) 4h 0 → 15m 1      ⛔
#      β0.85 (상한 13.7%) 4h 0 → 15m 1      ⛔
#
#    손절이 청산에서 멀수록 봉 안에서 청산이 먼저 닿을 여지가 커진다.
#
# ⛔ **여기가 β 의 유일한 자리다** — `config/rules/*.yml` 에 두지 않는다.
#    셋업별 β 는 `atr_stop_k` 와 똑같은 조작 통로다 (§6.1 · test_risk_policy.py).
#
# ✅ **0.40 으로 켠다** (2026-08-30 사용자 확정 — 배율을 올리기로 했다).
#
#    ⚠️ 현행 3x 판에는 사실상 무해하다: 3x 청산거리가 32.8% 라 상한이 13.1% 이고
#      보통 손절(2~5%)은 안 걸린다. 실제로 3x 에서 β 는 아무 일도 안 했다
#      (T124 · 10칸 중 2칸 · 대부분 차이가 정확히 0). 그러니 이 값을 켜 두고
#      배율만 올리면 된다 — 순서를 거꾸로 하면(배율 먼저) `require_stop_cap` 이 막는다.
stop_liquidation_cap_ratio: 0.40

# ═══════════════════════════════════════════════════════════════════════════
# 보호 손절 — `stop_mode: close` 매매법의 라이브가 거래소에 거는 조건부 자리 (T233 ② · 2026-09-09)
#
# 정상 손절은 세션이 4h 마감 몸통으로 판정해 시장가로 나간다(백테스트와 같은 규칙). 이 조건부는
# 봉이 마감되기 전에 청산가까지 밀리는 사고만 막는다. β 보다 커야 한다 (β 자리면 터치 손절이 된다).
# ⚠️ [결정 필요] 0.70 = 6x 에서 진입 -11.3% (청산 -16.2% · β 손절 상한 -6.5%).
stop_protect_ratio: 0.70

# ═══════════════════════════════════════════════════════════════════════════
# 손절 **하한** — β 의 짝 (T147~T150 · 2026-08-30)
#
# 🔴 진단 (T147 · 1.2.0 @ 6x · BN 1,325건): 지는 판과 이기는 판을 가르는 것은
#    **손절거리 하나**였다.
#
#      손절난 판  손절거리 중앙 **1.52%** · 905건 · 승률 6% · 합계 **-2,238,106**
#      이긴 판    손절거리 중앙 **6.47%** · 404건 · 승률 78% · 합계 +3,696,351
#      t = -18.1   (ADX 는 t=-1.3 로 **안 가른다** — 지금 게이트로는 못 걸러낸다)
#
#    SMA200 바로 옆에서 들어가면 손절이 1.5% 자리에 서고 정상 잡음이 털어 간다.
#    특히 롱 손절 241건은 **승률 0%**, 평균보유 16시간 — 들어가자마자 죽는다.
#
# ⛔ 뒤집기는 답이 아니었다: 손절 뒤 가격의 방향을 905건으로 쟀는데 1·2·4·8·16봉
#    전부 양수비율 45~49% · t<1.3 = **동전던지기**다. 손절은 타이밍이 틀린 게 아니라
#    애초에 가지 말았어야 할 자리였다. 그래서 뒤집는 대신 **안 간다**.
#
# ⭐ 값 근거 (겹치지 않는 1년 창 8칸 · 6x β0.40):
#      **0.50%  8/8** · 창별 수익차 중앙 +8.45%p · 최악 칸 **+2.79%p** · MDD -0.81%p
#        0.75%  7/8  · 최악 칸 -4.29%p
#        1.00%  7/8  · 최악 칸 -7.17%p
#    전 기간으로도 수익↑ MDD↓ Calmar↑ 이 **동시에** 난다 (BN 3.68→3.92 · Gate 3.80→4.06).
#    1.5% 부터 두 거래소가 함께 나빠진다 — 거기가 고원의 가장자리다.
stop_min_pct: 0.005

# 이 배율을 **넘으면** β 없이 판을 못 만든다 (`decision.risk.require_stop_cap`).
#
# 🔴 측정이 말하는 것은 "6x 가 좋다" 가 아니라 **"β 를 켠 6x 가 좋다"** 이다 —
#    6x β0 은 청산 25건이다 (T144). 둘을 따로 켤 수 있게 두면 언젠가 반쪽만 켜지고
#    그 반쪽이 하필 위험한 쪽이다. 그래서 설정 단계에서 묶는다 (절대 규칙 #8).
leverage_needing_stop_cap: 3

# 트레일링 스탑 활성 버킷 (§6.9 — 단타 기본 활성 / 장투 비활성).
#
# 슬라이더와 무관하다. 성향이 아니라 **버킷의 성질**이기 때문이다 —
# 장투에 트레일링을 걸면 정상적인 조정에서 털린다.
trailing_enabled_buckets: [scalp, swing]

# 열린 판들의 예산 합이 계좌를 **이 비율(예산 합 대비)까지** 넘어도 새 진입을 막지 않는다 (2026-09-06).
#
# 🔴 실계좌 실측: 자본 300 을 6판 예산으로 전부 쓴 펀드가 첫 수수료·미실현 -0.0049 에
#    "예산 합이 계좌보다 0.00 USDT 많다" 로 **전 판의 새 진입이 막혔다**. 예산은 띄울 때의 자본이고
#    계좌는 매 봉 움직이므로 100% 투입 펀드는 구조적으로 늘 한 푼 아래다.
#    막아야 할 부족은 Gate 가 새 주문을 LIQUIDATE_IMMEDIATELY 로 거절할 크기 — 300 이면 6 USDT 부터.
#    0 으로 두면 옛 동작(한 푼이라도 넘으면 막는다).
funding_shortfall_tolerance_pct: 0.02

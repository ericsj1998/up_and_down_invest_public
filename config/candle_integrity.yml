# 캔들 무결성 검사 임계값 (plan D-9 · spec §12.1, §7)
#
# ⚠️ 이 값들은 **실데이터를 보기 전에 정한 초기값**이다. 정확할 수 없다.
#    느슨하게 시작해 몇 건이 잡히는지 본 뒤 조정한다 — 처음부터 조이면 오탐이 백필을 막는다.
#    조정할 때는 docs/rules/candle_integrity_rules.md 의 조정 이력에 **근거를 남긴다**.
#
# Phase 0 은 기록만 하고 분석을 차단하지 않는다 (D-9). 차단 승격 조건은 위 문서 §5.

# 가격 스파이크: 직전 봉 종가 대비 변동률이 이 값을 넘으면 기록.
# 0.30 = ±30%. 코인은 30% 일일 변동이 실제로 있으므로 5m 봉 기준으로는 매우 느슨하다.
price_spike_pct: 0.30

# 거래량 스파이크: 직전 N봉 평균 대비 이 배수를 넘으면 기록.
volume_spike_multiple: 50

# 거래량 스파이크 판정에 쓸 직전 봉 개수.
# 이 개수만큼 앞선 봉이 없으면 판정을 **건너뛴다** — 표본 없이 판정하면 백필 구간의
# 첫 봉들이 전부 스파이크로 잡힌다.
volume_spike_window: 20

# 결측 봉 검사를 켤지. 코인은 24시간 장이라 정규 휴장 구멍이 없어 그대로 쓸 수 있다.
# 주식(P3)에서는 장 운영시간 캘린더가 없으면 매일 밤이 결측으로 잡히므로 반드시 재검토한다.
check_missing_bars: true

# 한 번의 검사에서 보고할 최대 이슈 수. 초과분은 잘라내고 잘렸다는 사실을 남긴다.
# 대량 손상 시 리포트가 수만 줄이 되어 읽을 수 없게 되는 것을 막는다.
max_issues_per_run: 500

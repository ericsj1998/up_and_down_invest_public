# Alembic 설정 (P0-4-5).
#
# sqlalchemy.url 을 여기 두지 않는다 — DB 자격증명은 .env.{환경} 에만 있고
# 이 파일은 커밋 대상이다 (spec §8, §12.4). env.py 가 DATABASE_URL 을 읽는다.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# 파일명 앞에 4자리 순번을 붙인다 — 적용 순서가 파일 목록에서 바로 보이게.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# 배포 이미지 — 서버 밖에서 만든다 (2026-09-04 · Lightsail 1 GB 는 빌드가 안 된다, T47).
#
# 트리거: `v*` 태그 push 또는 수동. 만든 이미지는 GHCR 로 간다:
#   ghcr.io/ericsj1998/up_and_down_invest/app:<tag>   (api · engine 공용)
#   ghcr.io/ericsj1998/up_and_down_invest/web:<tag>   (VITE_LABELS 기본 0 = 라벨 탭 없음)
# 서버는 `IMAGE_TAG=<tag> bash scripts/deploy/bluegreen.sh` 로 **받기만** 한다.
# 태그는 불변이다 — `latest` 를 만들지 않는다. 무엇이 떠 있는지는 태그가 말해야 한다.

name: release-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그 (예: v2026.09.04-1)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 태그 결정
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: app (api · engine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/app:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web (라벨 탭 제외 · VITE_LABELS=0)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 결과
        run: |
          echo "app: ${{ env.IMAGE_BASE }}/app:${{ steps.tag.outputs.tag }}"
          echo "web: ${{ env.IMAGE_BASE }}/web:${{ steps.tag.outputs.tag }}"

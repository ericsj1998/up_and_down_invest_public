[project]
name = "updown"
version = "1.6.1"
description = "업 앤 다운 — 주식·코인을 단타/스윙/장투 3버킷으로 운용하는 자동투자 플랫폼"
readme = "README.md"
authors = [{ name = "ericsj1998", email = "ericsj1998@gmail.com" }]
# D-7: 3.12 고정. 상한을 막는 이유는 numpy/pandas·psycopg3 등 바이너리 휠 호환성이며,
# 상향은 Phase 1 진입 시점에 재검토한다.
requires-python = ">=3.12,<3.13"

# 스펙 §2.1에 명시된 런타임 의존성만 선언한다.
# Phase 0 범위 밖(numpy/pandas → P1-2, Authlib/PyJWT → P3-8)은 넣지 않는다.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # D-2: psycopg3 — 런타임(async)과 Alembic(sync)을 드라이버 하나로 처리한다.
    "psycopg[binary,pool]>=3.2",
    # D-3: redis-py — 시세 캐시 / 단일 실행 락 / 알림 큐
    "redis>=5.2",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "websockets>=14.0",
    "structlog>=24.4",
    "pydantic-settings>=2.7",
    # D-9: 무결성 임계값을 YAML 로 주입한다 (코드에 박지 않는다 — §4.3.1 의 일반화).
    # pre-commit 을 통해 전이적으로 깔려 있었지만, 런타임이 쓰는 것은 명시 선언한다.
    "pyyaml>=6.0",
    # C2-3: 미국 장 시각·월 경계는 **뉴욕 현지시각 + tz DB** 다 (KST·오프셋 하드코딩 금지).
    # 리눅스에는 시스템 tz DB 가 보통 있지만, 없으면 `zoneinfo` 가 조용히 실패한다 —
    # 그러면 월봉 경계가 하루 밀린 채 그럴듯해 보인다. 명시 선언으로 그 경로를 없앤다.
    "tzdata>=2025.1",
    "matplotlib>=3.11.1",
    "psutil>=7.2.2",
]

# T224 — 탐지기 플러그인 접점. 비공개 전략 패키지는 자기 pyproject 에 같은 그룹으로 등록한다.
# 룰 설정 디렉토리·플레이북 파일도 같은 방식이다 (`updown.rules` · `updown.playbooks` → `() -> Path`).
[project.entry-points."updown.detectors"]
# 예시 매매법 — 공개 저장소에 남는 유일한 탐지기 (T224)
sample_ma_cross = "updown.analysis.detectors.sample_ma_cross:register"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pre-commit>=4.0",
    "import-linter>=2.1",
    # P1-2: 지표 **정답지 대조용**. 런타임 의존성이 아니다 (절대 규칙 #9, spec §2.1).
    #
    # spec §2.1 은 "자체 구현 (numpy/pandas)" 이라고 적었지만 numpy 는 float64 이고
    # `Indicators.atr14` 는 Decimal 이다 — ATR 은 `stop = entry - k*ATR` 로 실주문
    # 가격이 되므로 float 를 거칠 이유가 없다. 그래서 지표 코어는 Decimal + 순수
    # 파이썬이고, numpy/pandas/pandas-ta 는 전부 여기(dev)에만 있다.
    # 상세: src/updown/analysis/indicators/series.py 모듈 docstring
    "pandas-ta>=0.4.71b0",
    "pyarrow>=25.0.1",
    "types-psutil>=7.2.2.20260827",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# ============================================================
# ruff — lint + format 단일 도구
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# 🧹 archive/ 는 은퇴한 매매법의 동결 보관소다 (2026-08-25 대청소) — 린트로 고쳐 쓰지 않는다.
exclude = ["archive", "docs/ref_file"]  # ref_file = 외부 참고 코드 원문 — 우리 린트 대상 아님
# ruff 0.16+ 는 Markdown 안의 Python 코드 블록도 포맷 대상으로 잡는다.
# 스펙·계획 문서는 SSoT 산문이므로 포매터가 임의로 고쳐 쓰게 두지 않는다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — import 정렬
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib 사용 강제
    "ARG",      # 미사용 인자
    "RUF",      # ruff 고유 규칙
    "D",        # pydocstyle — CLAUDE.md §2 "공개 함수·클래스·모듈에 docstring"
]
ignore = [
    "D203",  # D211(클래스 앞 빈 줄 없음)과 상충 — D211을 택한다
    "D213",  # D212(요약을 첫 줄에)와 상충 — D212를 택한다
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # CLAUDE.md §2 — Google 스타일 고정

[tool.ruff.lint.per-file-ignores]
# 테스트·스크립트는 docstring 강제 대상이 아니다. 이름 자체가 문서 역할을 한다.
"tests/**" = ["D"]
"scripts/**" = ["D"]
# scripts/history/** 는 **동결된 측정 기록**이다 (scripts/history/README.md).
#   나중에 재포맷하면 "그때 무엇을 어떤 코드로 돌렸나"가 바뀐다 — 그러면 재현이
#   아니라 재작성이다. 그래서 줄길이·표현 규칙을 면제한다.
#   ⛔ 살아 있는 부품(scripts/scalp/**)에는 면제가 없다.
"scripts/history/**" = ["D", "E501", "C408", "RUF034", "B007", "ARG001", "SIM108"]
# scripts/research/** 는 **탐색 기록**이다. 신호·청산을 클로저로 갈아 끼우는 구조라
#   ARG001(안 쓰는 인자)·B023(루프 변수 포획)이 설계상 나온다 — 두 함수가 같은 서명을
#   지켜야 뼈대가 갈아 끼울 수 있기 때문이다.
#   ⛔ 여기서 나온 것이 실전으로 갈 때는 `src/` 로 옮겨 적고, 그때는 면제가 없다.
"scripts/research/**" = ["D", "E501", "C408", "ARG001", "B023", "RUF002"]
# 패키지 경계 표시용 __init__.py 는 모듈 docstring만 있으면 충분하다.
"src/updown/**/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true

# ============================================================
# pyright — CLAUDE.md §3 "Any 남용 금지"
# ============================================================
[tool.pyright]
# scripts/ 는 P0-8(백필 CLI)에서 생기며, 그때 include 에 추가한다.
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
# T65 scalp 랩(scripts/scalp) 을 테스트가 import 한다 — 해석 경로만 열어 준다.
extraPaths = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# 서드파티 스텁 부재는 우리 코드의 결함이 아니다. 우리 코드의 Any 유입만 잡는다.
reportMissingTypeStubs = false

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: 외부 API 를 실제로 호출하는 테스트 (P0-7-7). CI 제외 — 외부 장애가 CI 를 깨면 안 된다",
    "db: 실제 PostgreSQL 이 필요한 테스트. DATABASE_URL 이 없으면 skip 된다. 외부 의존이 아니라 CI 는 서비스 컨테이너로 실행한다",
]

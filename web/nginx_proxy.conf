# API 넘김 공통 — `/api/` 와 auth 의 정확한 위치들이 같이 include 한다.
# 🔴 팔로워의 503(리더 아님)·연결 실패는 다른 슬롯으로 한 번 더 보낸다.
#    `non_idempotent`: POST(주문·RUN 시작)도 포함 — 503 은 **처리 전** 거부라 중복이 없다.
proxy_next_upstream error timeout http_502 http_503 non_idempotent;
proxy_next_upstream_tries 2;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;

# 🔴 **SSE 를 버퍼링하면 안 된다.** AI 분석(`/ai/analyze`)과 봉 스트림이
#    서버-보내기 이벤트라, 버퍼에 갇히면 화면이 **끝날 때까지 아무것도 안 받는다**.
proxy_buffering off;
proxy_cache off;
proxy_set_header Connection "";

# ⚠️ 기본 60초로는 스트림이 끊긴다. 판이 몇 시간씩 도는 화면이다.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

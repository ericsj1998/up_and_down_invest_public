# 보안 헤더 (2026-08-30 외부 공개 준비) — server 와, add_header 를 따로 쓰는 location 이 같이 include 한다.
# ⚠️ nginx 는 location 에 add_header 가 하나라도 있으면 server 의 add_header 를 **물려받지 않는다** — 그래서 조각으로 뺐다.
#
# 🔴 세션 쿠키가 httpOnly 라 JS 는 못 읽는다. 남은 길이 **클릭재킹**이다 —
#    남의 페이지가 우리를 iframe 으로 덮고 사람이 청산 단추를 누르게 만들 수 있다.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# ⭐ 다른 사이트로 넘어갈 때 주소에 담긴 것(RUN id 등)을 안 흘린다.
add_header Referrer-Policy "same-origin" always;
# ⛔ 브라우저 기능을 처음부터 끈다 — 우리는 하나도 안 쓴다.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

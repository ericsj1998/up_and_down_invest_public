# 화면 서빙 + API 넘김.
#
# 🔴 **vite 프록시와 같은 모양이어야 한다** (`vite.config.ts`). 거기서 `/api` 를 떼고
# 8000 으로 넘기므로 여기도 그렇게 한다 — 다르면 개발에서 되던 호출이 배포에서 404 다.

# 🔴 T212 블루그린 — api 슬롯이 둘이다 (`api` · `api_b`). 어느 쪽이 살아 있든 넘긴다.
#
#    `resolve` (OSS 1.27.3+): 이름을 **기동 때가 아니라 주기적으로** 푼다. 없으면 nginx 가
#    `api_b` 를 못 찾아 아예 안 뜨고(평소엔 api_b 가 없다), 컨테이너가 재생성돼 IP 가 바뀌면
#    옛 IP 로 계속 보내 502 가 난다 (실제로 겪었다 — "api 재생성 뒤 web 재시작" 메모).
#    Docker 내장 DNS 127.0.0.11 · 5초마다 다시 푼다.
#
#    두 슬롯은 **대등**하다 (2026-09-11 수정). 전에는 `api_b` 가 `backup` 이었는데, 블루그린은 슬롯을
#    번갈아 쓰므로 절반의 시간은 죽은 `api` 가 1순위다 — 요청마다 죽은 IP 에 먼저 붙어 실패하고(3시간 737회),
#    살아 있는 `api_b` 가 정당한 503(펀드 생성 거절)을 내면 nginx 가 그것을 "실패" 로 세어 10초간
#    `no live upstreams` → 화면은 502 HTML 만 봤다(실측 · 이유가 가려졌다). 대등하면 죽은 쪽은 2초씩만
#    빠지고, 겹치는 몇 초 동안 팔로워가 받은 거래 POST 의 503(auth.guard)은 `proxy_next_upstream` 이
#    다른 슬롯으로 다시 보낸다.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream updown_api {
    zone updown_api 64k;
    server api:8000 resolve max_fails=1 fail_timeout=2s;
    server api_b:8000 resolve max_fails=1 fail_timeout=2s;
}

# 접근 로그에 **어느 슬롯이 무엇을 답했나**(`ups=주소/상태`)를 남긴다 — 502 가 nginx 것인지 api 것인지
# 로그만 보고 가르기 위해 (2026-09-11). 앞부분은 기본 combined 그대로라 기존 프로브의 grep 이 그대로 맞는다.
log_format upstream '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" ups=$upstream_addr/$upstream_status rt=$request_time';

# 🔴 앞에 Caddy(TLS 종단)가 있으면 그가 준 `X-Forwarded-Proto: https` 를 **그대로 넘긴다**.
#    `$scheme` 으로 덮어쓰면 api 가 "평문 HTTP" 로 보고 로그인을 503 으로 거부한다
#    (2026-09-05 첫 배포에서 실제로 그랬다 · auth.py `_require_https`). Caddy 없이 직접 받는
#    dev 에서는 헤더가 없으므로 nginx 자신의 스킴이 그대로 간다.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# ── T221 Demo Trading ────────────────────────────────────────────────────────────
# 데모 API 는 **별도 프로세스**(APP_ENV=paper · 테스트넷 키 · 별도 DB)다. 실계좌 키를 읽을 수조차 없다.
# 어디로 보낼지는 `updown_mode` 쿠키가 정한다 — 권한이 아니라 **행선지**다. 각 서버가 자기 DB 로 다시 판정한다.
# 🔴 `/api/auth/guest` 는 쿠키와 무관하게 **늘 데모**로 간다 (실계좌 서버는 그 경로에 404 를 낸다 — 이중 안전).
upstream updown_api_demo {
    zone updown_api_demo 64k;
    server api_demo:8000 resolve max_fails=1 fail_timeout=2s;
}
# 🔴 기본은 **데모**다 (사용자 2026-09-07 "처음 접속하는 사용자는 데모로 우선"). 쿠키가 `live` 라고 말할 때만
#    실계좌 API 로 간다 — 처음 온 사람·쿠키가 지워진 사람은 진짜 돈이 보이는 화면에 먼저 닿지 않는다.
#    api.ts `modeCookie()` · vite.config.ts 도 같은 규칙이다.
map $cookie_updown_mode $api_by_cookie {
    default updown_api_demo;
    live    updown_api;
}
# ⭐ 개인 토큰(MCP · Bearer)은 쿠키가 없다 — 토큰 값에 새긴 행선지(`updn_live_` · `updn_demo_`)로 보낸다
#    (2026-09-14 · 실계좌에서 만든 토큰이 데모 DB 에 없어 거절되던 문제). 접두어 없는 옛 토큰은 쿠키 규칙.
#    각 서버도 자기 행선지가 아닌 토큰은 거절한다(auth.py `caller_of`).
map $http_authorization $api_by_token {
    default                   "";
    "~^Bearer\s+updn_live_"   updown_api;
    "~^Bearer\s+updn_demo_"   updown_api_demo;
}
map $api_by_token $api_target {
    ""      $api_by_cookie;
    default $api_by_token;
}

# ── 정적 데모(2026-10-02 · 포트폴리오 데모) ─────────────────────────────────────────────
# 사용자: *"데모를 그냥 대충 뿌려만 주는 걸로 확 축약 · 실제 조회는 하지 않고"*. 1 GB 서버에서 데모 API 프로세스가 스왑을
# 밀어 실계좌 api 까지 스왑에 올렸다(데모 RAM 55 · 스왑 125 MB / 실계좌 RAM 164 · 스왑 250 MB). 그래서 **데모 행선지 요청은
# 저장본(web/public/__demo · `scripts/dev/demo_snapshot.sh`)으로 nginx 가 바로 답한다** — 데모 API 프로세스가 없다.
#   · GET/HEAD → `__demo/<경로>__<질의>.json` → `__demo/<경로>.json` → 없으면 404 JSON
#   · 그 밖(만들기 · 바꾸기) → 403 JSON 안내
#   · 게스트 입장 = 쿠키 하나(`updown_demo_guest`) · `auth/me` 는 그 쿠키로 게스트 / 입장 전 저장본을 고른다
#   · 구글 로그인(`auth/login` · `auth/callback`)은 **늘 실계좌 API** — 데모 API 가 없으니. 로그인 뒤 행선지는 live 로 바꾼다.
# 🔴 **TLS 앞단(Caddy)이 있을 때만** 켜진다(`X-Forwarded-Proto: https`) — 로컬 dev 의 데모는 지금처럼 진짜 데모 API 로 간다.
map $http_x_forwarded_proto $static_demo_on {
    default 0;
    https   1;
}
map $uri $auth_to_live {
    default 0;
    "~^/api/auth/(login|callback)$" 1;
}
map "$auth_to_live|$static_demo_on|$api_target" $api_final {
    default $api_target;
    "~^1\|1\|" updown_api;
}
map "$api_final|$static_demo_on" $demo_static {
    default 0;
    "updown_api_demo|1" 1;
}
# 쿠키 — 정적 데모일 때만 값이 있다(빈 값이면 add_header 가 아예 안 붙는다).
map $static_demo_on $guest_cookie {
    default "";
    1 "updown_demo_guest=1; Path=/; Max-Age=14400; SameSite=Lax; Secure";
}
map $static_demo_on $demo_mode_cookie {
    default "";
    1 "updown_mode=demo; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
}
map $static_demo_on $guest_clear_cookie {
    default "";
    1 "updown_demo_guest=; Path=/; Max-Age=0; SameSite=Lax; Secure";
}
map $static_demo_on $live_mode_cookie {
    default "";
    1 "updown_mode=live; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log upstream;

    root /usr/share/nginx/html;
    index index.html;

    # ── 보안 헤더 (2026-08-30 외부 공개 준비) ────────────────────────────
    #
    # ⚠️ 이 컨테이너는 **TLS 를 하지 않는다** — 앞단 프록시가 한다. 그래서 HSTS 는
    #    여기서 안 붙인다. 평문으로 도는 개발에 HSTS 가 붙으면 브라우저가 그 호스트를
    #    **기억해서** localhost 의 다른 프로젝트까지 https 로 강제한다 (되돌리기 번거롭다).
    #    앞단 Caddy 가 자동으로 붙인다.
    #
    # 보안 헤더 — 조각(nginx_security.conf). add_header 를 따로 쓰는 location 도 같은 조각을 include 한다.
    include /etc/nginx/snippets/updown_security.conf;

    # ⚠️ 화면이 커지면 gzip 이 체감된다. 이미 압축된 것은 다시 안 한다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 게스트 입장은 늘 데모로 (T221). 아래 일반 규칙보다 정확한 위치(=)라 먼저 잡힌다.
    # ⭐ 정적 데모면 데모 API 없이 쿠키 하나로 입장시킨다 — `auth/me` 가 그 쿠키로 게스트 저장본을 낸다.
    location = /api/auth/guest {
        include /etc/nginx/snippets/updown_security.conf;
        add_header Set-Cookie $guest_cookie always;
        add_header Set-Cookie $demo_mode_cookie always;
        default_type application/json;
        if ($static_demo_on) {
            return 200 '{"ok":true,"mode":"demo","guest":true,"static":true}';
        }
        proxy_pass http://updown_api_demo/auth/guest;
        include /etc/nginx/snippets/updown_proxy.conf;
    }

    # 나는 누구인가 — 정적 데모면 게스트 쿠키가 있으면 게스트 저장본, 없으면 입장 전 저장본(signed_in false).
    location = /api/auth/me {
        if ($demo_static) {
            rewrite ^ /__demo_me last;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_final;
        include /etc/nginx/snippets/updown_proxy.conf;
    }
    location = /__demo_me {
        internal;
        include /etc/nginx/snippets/updown_security.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        if ($cookie_updown_demo_guest = "1") {
            rewrite ^ /__demo/auth/me.json break;
        }
        rewrite ^ /__demo/auth/me_anon.json break;
    }

    # 나가기 — 정적 데모면 게스트 쿠키를 지우고 끝. 실계좌면 그대로 API 로.
    location = /api/auth/logout {
        include /etc/nginx/snippets/updown_security.conf;
        add_header Set-Cookie $guest_clear_cookie always;
        default_type application/json;
        if ($demo_static) {
            return 200 '{"ok":true,"static":true}';
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_final;
        include /etc/nginx/snippets/updown_proxy.conf;
    }

    # 구글 로그인 돌아오는 길 — 정적 데모면 늘 실계좌 API(`$api_final`)로 가고, 로그인 뒤 행선지를 live 로 바꾼다
    # (데모 행선지로 두면 `auth/me` 가 저장본(입장 전)을 내 로그인 화면으로 되돌아간다).
    location = /api/auth/callback {
        include /etc/nginx/snippets/updown_security.conf;
        add_header Set-Cookie $live_mode_cookie;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_final;
        include /etc/nginx/snippets/updown_proxy.conf;
    }

    location /api/ {
        # ⭐ 정적 데모 — 데모 행선지 요청은 저장본으로(아래 `/__demo/`).
        if ($demo_static) {
            rewrite ^/api/(.*)$ /__demo/$1 last;
        }
        # T221: 행선지가 변수(쿠키)라 proxy_pass 의 자동 URI 치환이 안 된다 — /api/ 를 손으로 벗긴다
        # (vite 의 rewrite 와 같은 일).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_final;
        include /etc/nginx/snippets/updown_proxy.conf;
    }

    # 정적 데모 저장본 — 질의까지 맞는 파일 → 경로만 맞는 파일 → 없으면 404 JSON. 만들기 · 바꾸기는 403 안내.
    location /__demo/ {
        internal;
        include /etc/nginx/snippets/updown_security.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403 '{"detail":"포트폴리오 데모(저장본)입니다 — 만들기 · 바꾸기는 꺼져 있습니다. 화면 · 차트 · 기록은 그대로 둘러볼 수 있습니다.","static_demo":true}';
        }
        try_files ${uri}__${args}.json ${uri}.json @demo_missing;
    }
    location @demo_missing {
        include /etc/nginx/snippets/updown_security.conf;
        default_type application/json;
        return 404 '{"detail":"포트폴리오 데모 — 이 화면 자료는 저장본에 없습니다","static_demo":true}';
    }

    # ⭐ 단일 페이지 앱이다 — `/paper/live123` 같은 주소도 index.html 로 보낸다.
    #    없으면 새로고침할 때마다 404 가 나고, 판을 창마다 띄우는 방식이 무너진다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ 해시가 붙은 산출물은 영원히 캐시해도 되지만 index.html 은 안 된다 —
    #    배포해도 옛 화면이 남는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

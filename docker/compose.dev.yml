# dev override — base 와의 **차이만** 둔다 (D-10).
#
# 호스트 포트 공개가 여기 있는 이유: WSL 셸에서 psql·DBeaver 로 직접 붙는 것은
# 개발 편의이며, live 에서는 DB 를 호스트에 노출하지 않는다.
# 컨테이너끼리는 서비스 이름(`postgres`, `redis`)으로 통신하므로 포트 공개와 무관하다.

services:
  postgres:
    ports:
      # 로컬에 이미 PG 가 떠 있을 수 있으므로 5432 를 피한다 (부록 A).
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  web:
    ports:
      # 개발 vite(5173)와 **겹치지 않게** 한다 — 둘을 나란히 띄워 비교할 수 있어야 한다.
      # ⚠️ Windows(Hyper-V)가 포트 구간을 통째로 예약해 Docker Desktop 이 5175 를 못 열 때가 있다
      #    (2026-09-05 실측: "ports are not available … /forwards/expose 500"). 그때는 WEB_PORT=5176 make up.
      - "${WEB_PORT:-5175}:80"
    # 🔬 라벨(임시) 탭 — **dev 에서만** 빌드에 넣는다 (T214 · 사용자 2026-09-04
    #    "배포에서는 빠지게"). paper·live 는 이 인자가 없어 기본 0 으로 빌드된다.
    build:
      args:
        VITE_LABELS: "1"

  api: &api_dev
    ports:
      - "8000:8000"
    # 🔬 라벨 API 도 dev 에서만 — 화면 쪽 `VITE_LABELS` 와 짝이다 (`api/main.py`).
    environment:
      UPDOWN_LABELS: "1"
      # 🔴 로컬 실계좌 모드는 **거래소 연결이 없다** (2026-09-06 · 사용자 결정 · S7). 화면·원장·백테스트 리포트만.
      #    테스트넷은 전부 데모 모드(api_demo · 로컬 전용 테스트넷 계정)에서 한다 — 계정 하나에 관리자 하나.
      #    `NONE` 은 어느 Market 값과도 안 맞아 live_markets() 가 빈 목록이 된다 → 콘솔은 "연결 없음" 카드.
      UPDOWN_MARKETS: NONE
    # 🔴 **컨테이너 API 가 반쪽이었다** (2026-08-20). `compose.base.yml` 이 넘기는 것은
    #    APP_ENV·LOG_LEVEL·DATABASE_URL·REDIS_URL·TZ 다섯뿐이라, Gate 키도 LLM 키도
    #    없어서 주문과 AI 분석이 죽었다. 그래서 `dev.sh` 가 API 를 **호스트에서** 띄웠고,
    #    WSL 이 업데이트로 재시작한 06:47 에 컨테이너는 다 살아 돌아왔는데 API 만 못 왔다.
    #
    # ⇒ paper·live 와 **같은 방식**으로 맞춘다. 셋이 다르면 "dev 는 되는데" 가 또 난다.
    env_file:
      - ../.env.dev
    # dev 만 소스를 마운트하고 리로드한다. 이미지를 다시 빌드하지 않고 고칠 수 있다.
    # live 에는 절대 두지 않는다 — 컨테이너 안 코드가 이미지와 달라지면 "무엇이 돌고 있는지"를
    # 이미지 태그로 답할 수 없다.
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      # 🔴 매트릭스는 **호스트에서** 돈다 (`scripts/run_matrix.py`). 진행 파일은
      #    호스트 `logs/progress` 에 쌓이는데 컨테이너가 명명 볼륨(`apilogs`)을 보면
      #    화면에 아무것도 안 나온다 — 실제로 v13 이 도는 중에 백테스트 탭이 빈 화면
      #    이었다. 같은 디렉터리를 보게 한다.
      #
      #    점검기의 이의제기(`logs/objections`)도 이걸로 호스트에 남는다. 볼륨 안에
      #    있으면 사람이 남긴 검토 기록이 리포지터리 밖에서 조용히 사라진다.
      #
      #    ⛔ live 에는 두지 않는다 — 소스 마운트를 live 에 안 두는 것과 같은 이유다.
      - ../logs:/app/logs
    # 🔴 매트릭스가 **호스트에서** 돌기 때문에 필요하다.
    #
    # `reporting/progress.py` 는 `os.kill(pid, 0)` 으로 살았는지 죽었는지 가른다
    # ("running 인데 pid 가 없으면 dead"). 컨테이너가 자기 PID 네임스페이스에 있으면
    # 호스트 pid 가 하나도 안 보여 **도는 작업 전부가 `dead` 로 뜬다** — 실제로 v13 이
    # 6워커로 돌고 있는데 화면이 "🔴 죽었다 · 재실행 대상"이라고 말했다.
    #
    # 아무것도 안 보이는 것보다 나쁘다. 화면이 거짓말을 하면 그것을 믿고 멀쩡한 작업을
    # 죽이고 다시 돌리게 된다 (절대 규칙 #8).
    #
    # ⛔ live 에는 두지 않는다. 거기서는 매트릭스가 컨테이너 안에서 돌아 필요 없고,
    #    PID 네임스페이스 공유는 격리를 푸는 일이다.
    pid: host
    # ⛔ **`--reload` 를 뺐다** (T72 §8 · 2026-08-28 사용자 확정).
    #
    #    src 를 한 글자만 고쳐도 프로세스가 재시작되고 **세션이 새로 만들어진다**.
    #    원장은 0 이 되는데 거래소 포지션과 미체결 지정가는 그대로 남으므로,
    #    그 순간 **손절도 원장도 없는 고아**가 된다. `adopt()` 는 조건부 손절을
    #    단서로 계획을 복구하는데 단서가 없으면 (옳게도) 거부한다 — 그래서 사람이
    #    치울 때까지 아무도 그 포지션을 관리하지 않는다.
    #
    #    실측: 2026-08-26 20:48(-127계약) · 2026-08-28 00:06(29·92·2556계약) 두 번
    #    다 이 경로였다. 손절 장착은 체결 후 중앙 107.7ms 라 자연 발생 확률은 낮은데,
    #    `--reload` 가 **파일을 고칠 때마다 그 주사위를 굴리고 있었다.**
    #
    # ⇒ 반영은 `docker compose ... up -d api` 로 **명시적으로** 한다. 판이 죽는 것이
    #    사고가 아니라 **의도**가 되고, 죽이기 전에 포지션을 비울 기회가 생긴다.
    #    (base 의 command 를 그대로 쓰므로 여기서 command 를 선언하지 않는다)
    #
    # ⚠️ 되돌리고 싶으면 라이브 판이 **하나도 없을 때** 되돌린다.

  # T212 블루그린 두 번째 슬롯 — api 와 같되 호스트 포트만 8001 (8000 과 겹치면 못 뜬다)
  api_b:
    <<: *api_dev
    ports:
      - "8001:8000"

  # ── T221 Demo Trading — 데모 API (dev). 키는 .env.dev(라이브 키 없음)를 그대로, DB 는 `<POSTGRES_DB>_demo`,
  #    호스트 포트 8002. 로그·펀드 JSON 은 ../logs_demo 로 갈라 둔다 — dev 의 펀드 파일과 섞이면 리포트의 펀드 라벨이 서로를 가리킨다.
  #
  # 🔴 **로컬 데모는 BINANCE 테스트넷이다** (2026-09-06 · 사용자 결정 · S7). 서버 데모는 Gate 테스트넷 A 를 관리하고, 그 계정에
  #    관리자가 둘이면 손절 트레일·진입·잔재 회수가 겹친다. Binance 테스트넷 키는 서버에 없으니 로컬이 유일한 관리자다.
  #    `.env.dev` 에는 Gate 테스트넷 키를 두지 않는다(같은 계정 = 관리자 둘). 로컬 `api`(실계좌 모드)는 거래소 연결이 없다.
  migrate_demo:
    env_file:
      - ../.env.dev
    environment:
      APP_ENV: dev
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../alembic:/app/alembic:ro

  api_demo:
    <<: *api_dev
    ports:
      - "8002:8000"
    # ⚠️ dev 의 데모는 APP_ENV=dev — dev 스택은 평문 HTTP 라 paper 면 세션 쿠키를 거부한다(secure_cookies).
    #    배포(live 오버라이드)에서는 base 의 paper 가 그대로 살고, nginx 가 TLS 뒤에서 X-Forwarded-Proto 를 넘긴다.
    environment:
      UPDOWN_LABELS: "1"
      APP_ENV: dev
      # base 는 GATE 다(서버 데모). 로컬 데모는 BINANCE 테스트넷 — 위 머리말.
      # + 미국 주식(T240 · 2026-09-09): 토스 시세 + 페이퍼 계좌(demo DB stock_paper_accounts). 실주문 없음.
      #   NYSE 는 비용표(costs.yml)가 비어 있어 아직 안 연다 — 유니버스에 NYSE 종목이 없다.
      UPDOWN_MARKETS: BINANCE,NASDAQ
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../logs_demo:/app/logs

  engine:
    # api 와 같은 이유로 키가 필요하다 — 엔진도 거래소를 부른다.
    env_file:
      - ../.env.dev
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      # api 와 **같은 곳**을 본다 (`compose.base.yml` 의 runlogs 설명 참조).
      - ../logs:/app/logs

  # dev 는 api 가 `../logs` 를 바인드하므로 펀드 JSON 도 거기 있다 — 백업이 같은 곳을 본다.
  # (base 의 `runlogs:/app/logs:ro` 는 dev 에서 빈 볼륨이다)
  backup:
    volumes:
      - backups:/backups
      - ../logs:/app/logs:ro
      - ../docker/backup.sh:/backup.sh:ro
